<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ZYVORA — an esports automation studio. We build the bots that run official Free Fire rooms for broadcast productions, and the websites where creators sell their merch."
    />
    <title>ZYVORA — Forge the future</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,800;0,900;1,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms detection (hidden; real form is rendered by React) -->
    <form name="partner" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="organization" />
      <input type="email" name="email" />
      <input type="text" name="partner_type" />
      <textarea name="message"></textarea>
    </form>
    <form name="roster" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="number" name="age" />
      <input type="text" name="uid" />
      <select name="device"></select>
      <input type="number" name="years_on_game" />
      <input type="number" name="years_in_esports" />
      <input type="text" name="contact" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
